name: Build

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (win-x64, self-contained)
    runs-on: windows-2025

    steps:
    - name: Checkout
      uses: actions/checkout@v7

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Publish
      run: dotnet publish WorkWindowsBar\WorkWindowsBar.csproj -c Release -f net10.0-windows -r win-x64 --self-contained true -p:Platform=AnyCPU -p:DebugType=None -p:DebugSymbols=false -o publish\WorkWindowsBar

    - name: Copy license
      run: |
        Copy-Item DistLicense.txt publish\WorkWindowsBar\License.txt
        Copy-Item NOTICE publish\WorkWindowsBar\NOTICE.txt

    - name: Upload artifact
      uses: actions/upload-artifact@v7
      with:
        name: WorkWindowsBar-win-x64
        path: publish\WorkWindowsBar\
